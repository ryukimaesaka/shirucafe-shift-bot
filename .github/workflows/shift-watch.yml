name: shift-watch
# OP(開店)シフトイン遅れの見張り。5分おきに実行し、未打刻の遅刻を LINE WORKS 店舗グループへ @All で通知。
# 初回通知後、そのグループで「返信」も「本人の打刻」も無ければ RESEND_MIN(15分)おきに同じ文を再送（最大 MAX_SENDS 回）。
# 返信検知は GAS(doPostのLINE WORKSコールバック) が最終返信時刻を記録し、shift-watch が lww:get で参照する。
# ※GitHub Actionsのschedule(cron)は遅延・間引きが大きいため、本番の5分間隔は
#   cron-job.org から workflow_dispatch を叩いて駆動する（shift-import/shift-tickと同型）。
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト実行（ジョブカン抜きでダミー1件を LINE WORKS に@All投稿して疎通確認）'
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'   # 保険。実際の5分間隔は cron-job.org で駆動。
concurrency:
  group: shift-watch         # 見張りは専用グループ。3分間隔が import/tick に妨げられないよう独立させる。
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    # ブラウザ同梱の公式イメージ（playwright installステップ不要＝高速・安定。3分間隔なので重要）
    container:
      image: mcr.microsoft.com/playwright:v1.47.0-jammy
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: node src/shift-watch.js
        env:
          WATCH_TEST: ${{ github.event.inputs.test == 'true' && '1' || '' }}
          JC_STATE: ${{ secrets.JC_STATE }}
          LW_CLIENT_ID: ${{ secrets.LW_CLIENT_ID }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          LW_SERVICE_ACCOUNT: ${{ secrets.LW_SERVICE_ACCOUNT }}
          LW_PRIVATE_KEY: ${{ secrets.LW_PRIVATE_KEY }}
          LW_BOT_ID: ${{ secrets.LW_BOT_ID }}
          LW_CHANNEL_MAP: ${{ secrets.LW_CHANNEL_MAP }}
          LW_DEFAULT_CHANNEL_ID: ${{ secrets.LW_DEFAULT_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LWW_WEBAPP_URL: ${{ secrets.LWW_WEBAPP_URL }}
          RUN_SECRET: ${{ secrets.RUN_SECRET }}
          GRACE_MIN: '5'
          RESEND_MIN: '15'
          MAX_SENDS: '4'
          OPEN_FROM: '6'
          OPEN_TO: '23'
